[package]
name = "tk-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tk-encode = { path = "vendor/tokenizers/tokenizers/tk-encode", default-features = false, features = ["bpe", "unigram", "wordpiece", "wordlevel", "normalizers", "unicode-scripts", "fancy-regex"] }
tk-serialize = { path = "vendor/tokenizers/tokenizers/tk-serialize", default-features = false, features = ["deserialize", "bpe", "unigram", "wordpiece", "wordlevel", "normalizers", "unicode-scripts", "fancy-regex"] }
tk-convert = { path = "vendor/tokenizers/tokenizers/tk-convert" }
serde_json = "1.0"


[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
[workspace]

[patch.crates-io]
# ptr_hash times its build steps with std::time::Instant, which panics on wasm32-unknown-unknown
ptr_hash = { path = "vendor/ptr_hash" }
