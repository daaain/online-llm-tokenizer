<!doctype html><meta charset="utf-8"><title>bench</title><pre id="out"></pre>
<script type="module">
import initWasm, { Tokenizer } from './pkg-web/tk_wasm.js'
import { AutoTokenizer, env } from './transformers.js'
env.localModelPath = '/models/'
env.allowRemoteModels = false
env.allowLocalModels = true
env.useBrowserCache = false

const params = new URLSearchParams(location.search)
const MODELS = params.get('models').split(',')
const repeat = Number(params.get('repeat') || 1)
const baseText = await (await fetch('/text.txt')).text()
const text = baseText.repeat(repeat)
const t = () => performance.now()
const results = { chars: text.length, models: {} }

// WASM module download is local here, so this is mostly compile + instantiate
let a = t(); const wasm = await initWasm({ module_or_path: '/pkg-web/tk_wasm_bg.wasm' }); results.wasmInit = t() - a

const jsons = {}
for (const m of MODELS) jsons[m] = await (await fetch(`/models/${m}/tokenizer.json`)).text()

const rs = {}, tj = {}
for (const m of MODELS) {
  const r = (results.models[m] = {})
  a = t(); rs[m] = new Tokenizer(jsons[m]); r.loadRs = t() - a
}
results.wasmMemoryMB = wasm.memory.buffer.byteLength / 1e6
const heapBefore = performance.memory.usedJSHeapSize
for (const m of MODELS) {
  const r = results.models[m]
  a = t(); tj[m] = await AutoTokenizer.from_pretrained(m); r.loadTjs = t() - a  // includes its own local fetch
  if (tj[m]?.decoder?.decoders?.at(-1)?.config?.type === 'Strip') tj[m].decoder.decoders.pop()
}

// What the UI does on every edit: encode + per-token decode, for every model
function runRs() {
  for (const m of MODELS) {
    let a = t(); const ids = rs[m].encode(text, true); const e = t() - a
    a = t(); const strs = rs[m].decodeEach(ids); const d = t() - a
    Object.assign(results.models[m], { encRs: e, decRs: d, ntok: ids.length })
  }
}
function runTjs() {
  for (const m of MODELS) {
    let a = t(); const ids = tj[m].encode(text); const e = t() - a
    a = t(); tj[m].batch_decode(ids.map((x) => [x]), { clean_up_tokenization_spaces: true }); const d = t() - a
    Object.assign(results.models[m], { encTjs: e, decTjs: d, ntokTjs: ids.length })
  }
}
if (window.gc) gc()
results.tjsHeapMB = (performance.memory.usedJSHeapSize - heapBefore) / 1e6
runRs(); runTjs() // warm up
a = t(); runRs(); results.allRs = t() - a
a = t(); runTjs(); results.allTjs = t() - a
window.results = results
document.getElementById('out').textContent = JSON.stringify(results, null, 1)
</script>
