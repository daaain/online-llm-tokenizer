<!doctype html><meta charset="utf-8"><title>workers</title>
<script type="module">
const MODELS = new URLSearchParams(location.search).get('models').split(',')
const text = await (await fetch('/text.txt')).text()
const t = () => performance.now()
let a = t()
const module = await WebAssembly.compileStreaming(fetch('/pkg-web/tk_wasm_bg.wasm'))
const compileMs = t() - a
const workers = MODELS.map(() => new Worker('/worker.js', { type: 'module' }))
const ask = (w, msg) => new Promise((res) => { w.onmessage = (e) => res(e.data); w.postMessage(msg) })
a = t()
const loads = await Promise.all(workers.map((w, i) => ask(w, { type: 'load', module, model: MODELS[i] })))
const loadWall = t() - a
await Promise.all(workers.map((w) => ask(w, { type: 'tokenize', text }))) // warm up
a = t()
const toks = await Promise.all(workers.map((w) => ask(w, { type: 'tokenize', text })))
const tokWall = t() - a
window.results = { cores: navigator.hardwareConcurrency, compileMs, loadWall, loads: loads.map((l) => l.ms), tokWall, toks: toks.map((x) => x.ms) }
</script>
